---
- name: Init block
  when: not control_plane_kubelet_conf.stat.exists
  block:
    - name: Install kube-vip (super-admin.conf during init)
      ansible.builtin.include_role:
        name: kube_vip
      vars:
        kube_vip_kubeconfig: /etc/kubernetes/super-admin.conf

    - name: Read installed kubeadm version
      ansible.builtin.command: kubeadm version -o short
      register: control_plane_kubeadm_version
      changed_when: false

    - name: Render kubeadm config
      ansible.builtin.template:
        src: kubeadm-init.yaml.j2
        dest: /etc/kubernetes/kubeadm-init.yaml
        mode: "0600"

    - name: Run kubeadm init
      ansible.builtin.command: kubeadm init --config /etc/kubernetes/kubeadm-init.yaml --upload-certs
      args:
        creates: /etc/kubernetes/kubelet.conf

    - name: Switch kube-vip to admin.conf
      ansible.builtin.replace:
        path: /etc/kubernetes/manifests/kube-vip.yaml
        regexp: 'path: /etc/kubernetes/super-admin.conf'
        replace: 'path: /etc/kubernetes/admin.conf'

    # kubelet restarts kube-vip after the switch and the VIP is gone for
    # several seconds. Ask the local API server until the new pod runs, then
    # wait for the VIP, so the following tasks do not hit the gap.
    - name: Wait for kube-vip to run with admin.conf
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ admin_kubeconfig }} --server https://{{ ansible_host }}:6443
        -n kube-system get pod kube-vip-{{ inventory_hostname }}
        -o 'jsonpath={.spec.volumes[?(@.name=="kubeconfig")].hostPath.path} {.status.containerStatuses[0].ready}'
      register: control_plane_vip_pod
      until: control_plane_vip_pod.stdout == admin_kubeconfig ~ ' true'
      retries: 60
      delay: 2
      changed_when: false

    - name: Wait for the API server on the VIP
      ansible.builtin.command: kubectl --kubeconfig {{ admin_kubeconfig }} get --raw /livez
      register: control_plane_vip_livez
      until: control_plane_vip_livez.rc == 0
      retries: 60
      delay: 2
      changed_when: false

# Join data is created on every run: tokens expire after 24 h,
# uploaded certificates after 2 h.
- name: Create join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: control_plane_token
  changed_when: false
  no_log: true

- name: Upload control plane certificates
  ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
  register: control_plane_certs
  changed_when: false
  no_log: true

- name: Publish join data for the other nodes
  ansible.builtin.set_fact:
    control_plane_join_cmd: "{{ control_plane_token.stdout }}"
    control_plane_cert_key: "{{ control_plane_certs.stdout_lines | last }}"
  no_log: true

- name: Create the local data directory
  ansible.builtin.file:
    path: "{{ local_kubeconfig | dirname }}"
    state: directory
    mode: "0700"
  become: false
  delegate_to: localhost

- name: Fetch admin kubeconfig to the workstation
  ansible.builtin.fetch:
    src: "{{ admin_kubeconfig }}"
    dest: "{{ local_kubeconfig }}"
    flat: true

- name: Restrict local kubeconfig permissions
  ansible.builtin.file:
    path: "{{ local_kubeconfig }}"
    mode: "0600"
  become: false
  delegate_to: localhost
