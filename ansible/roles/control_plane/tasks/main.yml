---
# control_plane_mode: init (first node) or join (all others).

- name: Check whether this node is already part of a cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: control_plane_kubelet_conf

- name: Initialize cluster
  ansible.builtin.include_tasks: init.yml
  when: control_plane_mode == 'init'

- name: Join as control plane
  ansible.builtin.include_tasks: join.yml
  when: control_plane_mode == 'join'

- name: Set up kubeconfig for {{ ansible_user }}
  block:
    - name: Create .kube directory
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Copy admin.conf
      ansible.builtin.copy:
        src: "{{ admin_kubeconfig }}"
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
