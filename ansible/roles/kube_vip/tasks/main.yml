---
# Writes the kube-vip static pod manifest. The manifest is generated by
# kube-vip itself, so its format always matches the pinned version.
# kube-vip holds the API VIP and announces LoadBalancer IPs via ARP. There
# is no IP pool: each LoadBalancer Service names its address with the
# annotation kube-vip.io/loadbalancerIPs (the gateway gets gateway_ip).
#
# kube_vip_kubeconfig: kubeconfig on the host that kube-vip uses.
# On the init node this must be super-admin.conf until `kubeadm init`
# is done, because admin.conf has no RBAC binding yet at that point.

- name: Pull kube-vip image
  ansible.builtin.command: ctr image pull {{ kube_vip_image }}
  register: kube_vip_pull
  changed_when: "'done' in kube_vip_pull.stdout"

- name: Generate kube-vip manifest
  ansible.builtin.command: >-
    ctr run --rm --net-host {{ kube_vip_image }} kube-vip-gen-{{ 99999 | random }}
    /kube-vip manifest pod
    --interface {{ kube_vip_interface }}
    --address {{ api_vip }}
    --controlplane
    --services
    --arp
    --leaderElection
  register: kube_vip_manifest
  changed_when: false

- name: Install kube-vip manifest
  ansible.builtin.copy:
    dest: /etc/kubernetes/manifests/kube-vip.yaml
    content: "{{ kube_vip_manifest.stdout | replace('path: /etc/kubernetes/admin.conf', 'path: ' ~ kube_vip_kubeconfig) }}\n"
    mode: "0600"
