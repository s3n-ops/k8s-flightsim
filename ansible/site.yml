---
# Bootstrap Kubernetes on the VMs created by Terraform.
# Leaves a bare kubeadm cluster: CNI only, no platform add-ons.

- name: Wait for cloud-init
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait until cloud-init is done
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

- name: Prepare all nodes
  hosts: all
  become: true
  roles:
    - k8s_common

- name: Initialize first control plane node
  hosts: control_plane[0]
  become: true
  roles:
    - role: control_plane
      vars:
        control_plane_mode: init
    - cni_calico

- name: Join remaining control plane nodes
  hosts: control_plane[1:]
  become: true
  serial: 1
  roles:
    - role: control_plane
      vars:
        control_plane_mode: join

- name: Join workers
  hosts: workers
  become: true
  roles:
    - worker

- name: Verify cluster
  hosts: control_plane[0]
  become: true
  gather_facts: false
  tasks:
    - name: Wait until all nodes are Ready
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ admin_kubeconfig }}
        wait --for=condition=Ready nodes --all --timeout=600s
      changed_when: false

    - name: Show nodes
      ansible.builtin.command: kubectl --kubeconfig {{ admin_kubeconfig }} get nodes -o wide
      register: nodes
      changed_when: false

    - name: Nodes
      ansible.builtin.debug:
        var: nodes.stdout_lines
